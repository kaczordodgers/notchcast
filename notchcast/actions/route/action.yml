name: Route macOS jobs
description: A runs-on label for each of count macOS jobs, an idle maintainer Mac (notchcast/runner) first, else the hosted image.
inputs:
  count:
    description: How many macOS jobs the run starts.
    required: true
  vars:
    description: toJSON(vars) of the calling workflow, which holds each Mac's idle count.
    required: true
  eligible:
    description: The string false keeps every job hosted.
    default: 'true'
outputs:
  runners:
    description: JSON array of count runs-on labels, the Macs first.
    value: ${{ steps.route.outputs.runners }}
runs:
  using: composite
  steps:
    - id: route
      shell: bash
      env:
        COUNT: ${{ inputs.count }}
        VARS: ${{ inputs.vars }}
        ELIGIBLE: ${{ inputs.eligible }}
        ACTOR: ${{ github.actor }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        ACTION: ${{ github.event.action }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        runners=$(python3 "$GITHUB_ACTION_PATH/../../runner/route.py")
        echo "runners=$runners" >> "$GITHUB_OUTPUT"
        echo "$runners"
