name: Upstream tests
description: Run upstream's Scripts/run-tests.sh in src, minus CI_SKIP_TESTS (config.env), harnesses the hosted VM cannot run.
inputs:
  upstream:
    description: The pristine upstream commit under our commits; a harness that fails there too is not ours.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: src
      env:
        UPSTREAM: ${{ inputs.upstream }}
      run: |
        set -a; source ../tools/notchcast/config.env; set +a
        # Edit only the working copy for this run: run() returns early for a skipped name. Commits are untouched.
        grep -q '^    local name=\$1$' Scripts/run-tests.sh || { echo "::error::run-tests.sh changed shape; update the skip hook"; exit 1; }
        sed -i '' -E 's/^    local name=\$1$/    local name=$1; case " $CI_SKIP_TESTS " in *" $name "*) echo "skipped on the runner: $name" >\&2; return 0;; esac/' Scripts/run-tests.sh
        status=0
        ./Scripts/run-tests.sh || status=$?
        # A harness that fails once is run again alone (the hosted VM is slower and noisier than a Mac);
        # it must pass then. A suite that failed with no harness marked failed is not retried.
        BIN="${TMPDIR:-/tmp}/tinycast-harness"
        if [ "$status" -ne 0 ] && ls "$BIN"/*.failed >/dev/null 2>&1; then
          failed="$(for f in "$BIN"/*.failed; do basename "$f" .failed; done)"
          mkdir -p "$RUNNER_TEMP/first-try" && cp "$BIN"/*.log "$RUNNER_TEMP/first-try/" 2>/dev/null || true
          still=""
          for name in $failed; do
            echo "::warning::retrying $name alone"
            ./Scripts/run-tests.sh "$name" || still="$still $name"
          done
          # Still failing: ignored when it fails on the pristine upstream commit too (upstream's own flake or the VM).
          status=0
          if [ -n "$still" ]; then
            git worktree add -q --detach "$RUNNER_TEMP/pristine" "$UPSTREAM"
            for name in $still; do
              # A harness upstream does not have is ours, and "No harness named" must not excuse it.
              if [ ! -e "$RUNNER_TEMP/pristine/Tests/$name.swift" ]; then
                echo "::error::$name fails with our commits and does not exist on upstream"; status=1
                continue
              fi
              # Its own TMPDIR, so our failed harness's logs stay for the step below.
              if (cd "$RUNNER_TEMP/pristine" && TMPDIR="$RUNNER_TEMP/pristine-tmp" && mkdir -p "$TMPDIR" && export TMPDIR \
                  && ./Scripts/run-tests.sh "$name" >/dev/null 2>&1); then
                echo "::error::$name fails with our commits and passes on upstream ${UPSTREAM:0:7}"; status=1
              else
                echo "::warning::$name fails on upstream ${UPSTREAM:0:7} too; not ours, ignored"
              fi
            done
            git worktree remove --force "$RUNNER_TEMP/pristine"
          fi
        fi
        git checkout -- Scripts/run-tests.sh
        exit $status
    - name: Failed harness logs
      if: failure()
      shell: bash
      run: |
        for f in "${TMPDIR:-/tmp}"/tinycast-harness/*.failed; do
          [ -e "$f" ] || continue
          n="$(basename "$f" .failed)"; echo "::group::$n"; cat "${f%.failed}.log"; echo "::endgroup::"
        done
