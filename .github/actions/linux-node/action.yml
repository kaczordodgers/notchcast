name: Install pinned Linux Node
description: Verify and install Node in the runner's job temporary directory.
inputs:
  version:
    description: Node release version
    required: true
  sha256:
    description: SHA-256 of the Linux x64 archive
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NODE_VERSION: ${{ inputs.version }}
        NODE_SHA256: ${{ inputs.sha256 }}
      run: |
        release="node-v$NODE_VERSION-linux-x64"
        archive="$RUNNER_TEMP/$release.tar.xz"
        curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/$release.tar.xz" -o "$archive"
        printf '%s  %s\n' "$NODE_SHA256" "$archive" | sha256sum -c -
        tar -xJf "$archive" -C "$RUNNER_TEMP"
        "$RUNNER_TEMP/$release/bin/node" --version
        echo "$RUNNER_TEMP/$release/bin" >> "$GITHUB_PATH"
