# Keep main = upstream main + our commits, and mirror upstream releases. See notchcast/README.md.
name: Sync

on:
  # Never fired for this fork so far; notchcast/kick.sh (launchd notchcast.kick) is the trigger that is relied on.
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time; a newer trigger replaces a pending one, never a running build. A main commit replaced that
# way is still tested: plan tests any main without a green `notchcast/tested` status.
concurrency:
  group: sync
  cancel-in-progress: false

env:
  FORK_SSH: git@github.com:${{ github.repository }}.git

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Also replays our commits here, on Linux: a conflict is reported (issue notchcast-sync) without a macOS runner.
    permissions:
      contents: read
      statuses: read
      issues: write
    outputs:
      rebase: ${{ steps.plan.outputs.rebase }}
      test_main: ${{ steps.plan.outputs.test_main }}
      main: ${{ steps.plan.outputs.main }}
      base: ${{ steps.plan.outputs.base }}
      upstream_main: ${{ steps.plan.outputs.upstream_main }}
      main_key: ${{ steps.plan.outputs.main_key }}
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 notchcast/ci.py plan

  # Upstream moved: replay our commits onto it, build, test, and only then move main (lease on what plan saw).
  # Nothing to replay but main not tested yet (a push): build and test main as it is, once; nothing is pushed.
  # Either way the tested commit gets a green `notchcast/tested` status.
  # Issues: kind sync for a replay onto new upstream (cause stable across upstream commits), main for main as it is.
  main:
    name: ${{ needs.plan.outputs.rebase == 'true' && 'replay' || 'main' }}
    needs: plan
    if: needs.plan.outputs.rebase == 'true' || needs.plan.outputs.test_main == 'true'
    runs-on: xcode-27
    timeout-minutes: 120
    environment: sync
    permissions:
      contents: read
      statuses: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.main }}
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.main }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/notchcast/actions/xcode
      - uses: ./tools/notchcast/actions/xcodegen
      - name: Replay our commits onto upstream main
        if: needs.plan.outputs.rebase == 'true'
        working-directory: src
        run: |
          git fetch -q https://github.com/abue-ammar/tinycast.git "+refs/heads/main:refs/remotes/upstream/main"
          test "$(git rev-parse refs/remotes/upstream/main)" = "${{ needs.plan.outputs.upstream_main }}" || git fetch -q https://github.com/abue-ammar/tinycast.git "${{ needs.plan.outputs.upstream_main }}"
          python3 ../tools/notchcast/ci.py replay . "${{ needs.plan.outputs.upstream_main }}"
      - name: Regenerate project before building main
        working-directory: src
        run: '"$XCODEGEN" generate --quiet'
      - name: Build (Debug, unsigned)
        working-directory: src
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build -quiet
      - uses: ./tools/notchcast/actions/tests
        with:
          # A harness that also fails on this upstream commit is not ours.
          upstream: ${{ needs.plan.outputs.rebase == 'true' && needs.plan.outputs.upstream_main || needs.plan.outputs.base }}
      - uses: ./tools/notchcast/actions/deploy-key
        if: needs.plan.outputs.rebase == 'true'
        with:
          key: ${{ secrets.DEPLOY_KEY }}
      # The only history rewrite in this repo: main moves onto new upstream, guarded by a lease on what plan saw.
      - name: Update main
        if: needs.plan.outputs.rebase == 'true'
        working-directory: src
        run: |
          git -c core.hooksPath=/dev/null push --force-with-lease="refs/heads/main:${{ needs.plan.outputs.main }}" "$FORK_SSH" HEAD:refs/heads/main
          rm -f "$RUNNER_TEMP/deploy-key"
      - name: Mark the commit tested
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" -f state=success -f context=notchcast/tested \
            -f description="Debug build and upstream tests green" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Close resolved issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${{ needs.plan.outputs.rebase }}" != true ] || python3 tools/notchcast/ci.py issue close sync
          python3 tools/notchcast/ci.py issue close main
      # A failure here loses this sync's notice (main has already moved), so it never fails the run.
      - name: Upstream design-system changes
        if: needs.plan.outputs.rebase == 'true'
        continue-on-error: true
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ../tools/notchcast/ci.py design-notice . "${{ needs.plan.outputs.base }}" "${{ needs.plan.outputs.upstream_main }}"
      - name: Did main move under us?
        id: raced
        if: failure() && needs.plan.outputs.rebase == 'true'
        run: |
          NOW="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          echo "moved=$([ "$NOW" != "${{ needs.plan.outputs.main }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Remember the failure
        if: failure() && (needs.plan.outputs.rebase != 'true' || steps.raced.outputs.moved == 'false')
        uses: ./tools/notchcast/actions/remember-failure
        with:
          key: ${{ needs.plan.outputs.rebase == 'true' && needs.plan.outputs.main_key || format('test-{0}', needs.plan.outputs.main) }}
          deploy-key: ${{ secrets.DEPLOY_KEY }}
      - name: Report the failure
        if: failure() && (needs.plan.outputs.rebase != 'true' || steps.raced.outputs.moved == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ needs.plan.outputs.main }}
          UP: ${{ needs.plan.outputs.upstream_main }}
          REBASE: ${{ needs.plan.outputs.rebase }}
        run: |
          if [ "$REBASE" = true ]; then
            python3 tools/notchcast/ci.py issue open sync "Sync failed: upstream ${UP:0:7} + main ${MAIN:0:7}" "build or tests red with main $MAIN"
          else
            python3 tools/notchcast/ci.py issue open main "main ${MAIN:0:7} fails its build or tests" "test-$MAIN"
          fi

  release:
    needs: [plan, main]
    # After main: a release is built from the main this run ends with. Skipped main (nothing to rebase) is fine.
    if: always() && needs.plan.result == 'success' && needs.main.result != 'failure' && needs.plan.outputs.releases != '[]'
    runs-on: xcode-27
    timeout-minutes: 120
    environment: sync
    permissions:
      contents: write
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
    env:
      TAG: ${{ matrix.release.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.main }}
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.main }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/notchcast/actions/xcode
      - uses: ./tools/notchcast/actions/xcodegen
      - name: Read upstream's release
        id: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/notchcast/ci.py app-info "$TAG" "$RUNNER_TEMP"
      - name: Replay our commits onto the tag
        working-directory: src
        run: |
          git fetch -q https://github.com/abue-ammar/tinycast.git "+refs/heads/main:refs/remotes/upstream/main" "+refs/tags/$TAG:refs/tags/$TAG"
          python3 ../tools/notchcast/ci.py replay . "refs/tags/$TAG^{commit}"
          echo "TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_ENV"
      - uses: ./tools/notchcast/actions/tests
        with:
          upstream: ${{ env.TAG_COMMIT }}
      - name: Import the signing identity
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
      # Name and bundle id come from project.yml (Notchcast, app.notchcast); version and build from upstream's release.
      - name: Build (Release, signed, arm64)
        working-directory: src
        env:
          VERSION: ${{ steps.app.outputs.version }}
          BUILD: ${{ steps.app.outputs.build }}
        run: |
          set -a; source ../tools/notchcast/config.env; set +a
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            build -quiet
      - name: Verify the app
        env:
          VERSION: ${{ steps.app.outputs.version }}
        run: |
          set -a; source tools/notchcast/config.env; set +a
          NAME="$APP_NAME"
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/$NAME.app"
          bash tools/notchcast/verify-signature.sh "$APP" ./src/Scripts/verify-signature.sh
          ./tools/notchcast/check-identity.sh app "$APP"
          codesign --verify --deep --strict "$APP"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$APP/Contents/Info.plist"; }
          test "$(plist CFBundleIdentifier)" = "$BUNDLE_ID"
          test "$(plist CFBundleShortVersionString)" = "$VERSION"
          codesign -d --extract-certificates="$RUNNER_TEMP/cert" "$APP"
          LEAF="$(shasum -a 1 "$RUNNER_TEMP/cert0" | awk '{print toupper($1)}')"
          test "$LEAF" = "$SIGN_SHA1" || { echo "::error::signed by $LEAF, expected $SIGN_SHA1"; exit 1; }
          for BIN in "$APP/Contents/MacOS/$NAME" "$APP/Contents/Helpers/ClipboardTextHelper" "$APP/Contents/Helpers/FileIndexHelper"; do
            test "$(lipo -archs "$BIN")" = arm64
          done
      - name: Package zip and dmg
        env:
          VERSION: ${{ steps.app.outputs.version }}
        run: |
          set -a; source tools/notchcast/config.env; set +a
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/$APP_NAME.app"
          mkdir -p dist
          # Only ditto keeps the signature verifiable; the updater expands the zip with ditto.
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/$APP_NAME-$VERSION.zip"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -quiet -srcfolder "$STAGE" -volname "$APP_NAME" -format UDZO "dist/$APP_NAME-$VERSION.dmg"
          ls -l dist
      - uses: ./tools/notchcast/actions/deploy-key
        with:
          key: ${{ secrets.DEPLOY_KEY }}
      # Upstream's tag, unchanged. GITHUB_TOKEN cannot push commits that touch workflows; the deploy-key push may
      # trigger workflows, but the tagged tree's upstream workflows cannot read the secrets (environment `sync`, main only).
      - name: Mirror the tag
        working-directory: src
        run: |
          if [ -z "$(git ls-remote "$FORK_SSH" "refs/tags/$TAG")" ]; then
            git -c core.hooksPath=/dev/null push "$FORK_SSH" "refs/tags/$TAG:refs/tags/$TAG"
          fi
          rm -f "$RUNNER_TEMP/deploy-key"
      - name: Publish the release
        env:
          TITLE: ${{ matrix.release.title }}
          PRERELEASE: ${{ matrix.release.prerelease }}
          VERSION: ${{ steps.app.outputs.version }}
          MAIN: ${{ needs.plan.outputs.main }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -a; source tools/notchcast/config.env; set +a
          UPSTREAM="$(git -C src rev-parse "refs/tags/$TAG^{commit}")"
          {
            cat "$RUNNER_TEMP/upstream-notes.md"
            printf '\n\n---\nNotchcast build of %s %s (%s) with our commits from main %s, signed by %s (SHA-1 %s).\n' \
              "$UPSTREAM_REPO" "$TAG" "${UPSTREAM:0:12}" "${MAIN:0:12}" "$SIGN_IDENTITY" "$SIGN_SHA1"
          } > "$RUNNER_TEMP/notes.md"
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" "dist/$APP_NAME-$VERSION.zip" "dist/$APP_NAME-$VERSION.dmg" \
            -R "$GITHUB_REPOSITORY" --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" "${FLAGS[@]}"
      - name: Close this tag's failure issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/notchcast/ci.py issue close release "release-$TAG"
      - name: Remember the failure
        if: failure()
        uses: ./tools/notchcast/actions/remember-failure
        with:
          key: release-${{ matrix.release.tag }}-${{ needs.plan.outputs.main }}
          deploy-key: ${{ secrets.DEPLOY_KEY }}
      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ needs.plan.outputs.main }}
        run: |
          python3 tools/notchcast/ci.py issue open release "Release $TAG failed with main ${MAIN:0:7}" "release-$TAG"
