name: Leaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosted_linux:
        description: Run Linux checks on GitHub-hosted runners
        type: boolean
        default: false
      base:
        description: Base commit the checks compare against, as a PR's base (notchcast/train.sh)
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || github.event.pull_request.head.label || format('{0}:{1}', github.repository_owner, github.ref_name) }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux-runner: ${{ steps.linux.outputs.runs-on }}
    steps:
      - name: Linux runner availability
        id: linux
        env:
          POOL_FREE: ${{ vars.POOL_FREE_LINUX }}
          FORCE_HOSTED: ${{ inputs.hosted_linux }}
        shell: bash
        run: |
          runner=ubuntu-latest
          if [[ "$FORCE_HOSTED" != true && "$POOL_FREE" =~ ^([1-9][0-9]{0,8})[[:blank:]]([0-9]{10})$ ]]; then
            age=$(( $(date +%s) - 10#${BASH_REMATCH[2]} ))
            if (( age >= 0 && age < 180 )); then runner=linux-pool; fi
          fi
          echo "runs-on=$runner" >> "$GITHUB_OUTPUT"
  leaks:
    needs: route
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.route.outputs.linux-runner == 'linux-pool' && 'linux-pool' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Prepare clean Linux workspace
        shell: bash
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          fi
          mkdir -p "$RUNNER_TEMP/home"
          printf 'HOME=%s/home\nTMPDIR=%s\nnpm_config_cache=%s/npm\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: A train run names its base
        if: startsWith(github.ref, 'refs/heads/train/') && inputs.base == ''
        run: |
          echo "::error::train branches are dispatched by notchcast/train.sh with -f base=<main sha>"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-python
      # Our commits only: upstream's history is upstream's.
      - name: Our commits
        run: |
          bash notchcast/fetch-upstream.sh
          echo "BASE=$(git merge-base HEAD refs/remotes/upstream/main)" >> "$GITHUB_ENV"
      - name: Allowed commit emails
        env:
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || inputs.base && format('{0}..HEAD', inputs.base) || 'refs/remotes/upstream/main..HEAD' }}
        run: python3 notchcast/check-commit-emails.py "$COMMIT_RANGE"
      - name: Forbidden names and IDs in added lines
        run: notchcast/check-identity.sh diff "$BASE"
      - name: Forbidden names and IDs in commit metadata
        run: notchcast/check-identity.sh metadata "$BASE"
      - name: Secrets (gitleaks)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfLo "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --log-opts="$BASE..HEAD" --redact --no-banner --exit-code 1 .
