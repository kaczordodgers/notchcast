name: Snapshot
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 120
    environment: sync
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Plan snapshot
        id: plan
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 notchcast/snapshot.py
      - uses: actions/checkout@v7
        if: steps.plan.outputs.tag != ''
        with:
          ref: ${{ steps.plan.outputs.main }}
          path: tools
          persist-credentials: false
      - uses: ./tools/notchcast/actions/xcode
        if: steps.plan.outputs.tag != ''
      - uses: ./tools/notchcast/actions/xcodegen
        if: steps.plan.outputs.tag != ''
      - name: Find pristine upstream baseline
        id: baseline
        if: steps.plan.outputs.tag != ''
        working-directory: src
        run: |
          git fetch -q https://github.com/abue-ammar/tinycast.git "+refs/heads/main:refs/remotes/upstream/main"
          echo "upstream=$(git merge-base HEAD refs/remotes/upstream/main)" >> "$GITHUB_OUTPUT"
      - name: Regenerate project
        if: steps.plan.outputs.tag != ''
        working-directory: src
        run: '"$XCODEGEN" generate --quiet'
      - uses: ./tools/notchcast/actions/tests
        id: tests
        if: steps.plan.outputs.tag != ''
        continue-on-error: true
        with:
          upstream: ${{ steps.baseline.outputs.upstream }}
      - name: Lint
        id: checks
        if: steps.plan.outputs.tag != '' && steps.tests.outcome == 'success'
        working-directory: src
        run: |
          command -v swiftlint >/dev/null || brew install --quiet swiftlint
          if ./Scripts/lint.sh; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Snapshot skipped: harnesses or lint failed"
          fi
      - name: Import the signing identity
        if: steps.checks.outputs.green == 'true'
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Build (Release, signed, arm64)
        if: steps.checks.outputs.green == 'true'
        working-directory: src
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          BUILD: ${{ steps.plan.outputs.build }}
        run: |
          set -a; source ../tools/notchcast/config.env; set +a
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            build -quiet
      - name: Verify the app
        if: steps.checks.outputs.green == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -a; source tools/notchcast/config.env; set +a
          NAME="$APP_NAME"
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/$NAME.app"
          ./src/Scripts/verify-signature.sh "$APP"
          codesign --verify --deep --strict "$APP"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$APP/Contents/Info.plist"; }
          test "$(plist CFBundleIdentifier)" = "$BUNDLE_ID"
          test "$(plist CFBundleShortVersionString)" = "$VERSION"
          codesign -d --extract-certificates="$RUNNER_TEMP/cert" "$APP"
          LEAF="$(shasum -a 1 "$RUNNER_TEMP/cert0" | awk '{print toupper($1)}')"
          test "$LEAF" = "$SIGN_SHA1" || { echo "::error::signed by $LEAF, expected $SIGN_SHA1"; exit 1; }
          for BIN in "$APP/Contents/MacOS/$NAME" "$APP/Contents/Helpers/ClipboardTextHelper" "$APP/Contents/Helpers/FileIndexHelper"; do
            test "$(lipo -archs "$BIN")" = arm64
          done
      - name: Check app identity
        if: steps.checks.outputs.green == 'true'
        run: |
          source tools/notchcast/config.env
          ./tools/notchcast/check-identity.sh app "$RUNNER_TEMP/DerivedData/Build/Products/Release/$APP_NAME.app"
      - name: Launch and stay alive
        if: steps.checks.outputs.green == 'true'
        run: |
          source tools/notchcast/config.env
          mkdir -p "$RUNNER_TEMP/launch"
          ditto "$RUNNER_TEMP/DerivedData/Build/Products/Release/$APP_NAME.app" "$RUNNER_TEMP/launch/$APP_NAME.app"
          "$RUNNER_TEMP/launch/$APP_NAME.app/Contents/MacOS/$APP_NAME" &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
          sleep 30
          kill -0 "$PID" || { echo '::error::Snapshot skipped: app did not stay alive'; exit 1; }
      - name: Package zip and dmg
        if: steps.checks.outputs.green == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -a; source tools/notchcast/config.env; set +a
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/$APP_NAME.app"
          mkdir -p dist
          # Only ditto keeps the signature verifiable; the updater expands the zip with ditto.
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/$APP_NAME-$VERSION.zip"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -quiet -srcfolder "$STAGE" -volname "$APP_NAME" -format UDZO "dist/$APP_NAME-$VERSION.dmg"
          ls -l dist
      - uses: ./tools/notchcast/actions/deploy-key
        if: steps.checks.outputs.green == 'true'
        with:
          key: ${{ secrets.DEPLOY_KEY }}
      - name: Tag and publish snapshot
        if: steps.checks.outputs.green == 'true'
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          MAIN: ${{ steps.plan.outputs.main }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          source notchcast/config.env
          git -c user.name=Damian -c user.email=336236323+kaczordodgers@users.noreply.github.com tag -a "$TAG" "$MAIN" -m "Notchcast snapshot $MAIN"
          git push "git@github.com:$GITHUB_REPOSITORY.git" "refs/tags/$TAG"
          rm -f "$RUNNER_TEMP/deploy-key"
          printf 'Notchcast snapshot of main %s. Signed arm64 build.\n' "$MAIN" > "$RUNNER_TEMP/snapshot-notes.md"
          gh release create "$TAG" "../dist/$APP_NAME-$VERSION.zip" "../dist/$APP_NAME-$VERSION.dmg" \
            -R "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Notchcast $VERSION" --notes-file "$RUNNER_TEMP/snapshot-notes.md"
      - name: Fail when a planned snapshot was skipped
        if: steps.plan.outputs.tag != '' && steps.checks.outputs.green != 'true'
        env:
          TESTS: ${{ steps.tests.outcome }}
          LINT_GREEN: ${{ steps.checks.outputs.green }}
        run: |
          echo "::error::Snapshot not published: tests=$TESTS lint-green=${LINT_GREEN:-false}"
          exit 1
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/deploy-key" "$RUNNER_TEMP/cert.p12"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
