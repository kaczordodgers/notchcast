name: Main harnesses

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-harnesses-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harnesses:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/notchcast/actions/xcode
      - name: Changed harnesses
        working-directory: src
        run: |
          git fetch -q origin '+refs/notchcast/synced/*:refs/notchcast/synced/*'
          BEFORE=$(bash notchcast/fork-point.sh origin/main HEAD)
          ./notchcast/changed-harnesses.sh "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/selected"
          cat "$RUNNER_TEMP/selected"
      - name: Run harnesses, retry failures alone
        working-directory: src
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: '1'
          NOTCHCAST_TEST_HELPER_EXECUTABLE: '1'
        run: |
          export TMPDIR="$RUNNER_TEMP/main-harnesses"
          mkdir -p "$TMPDIR"
          source ../tools/notchcast/config.env
          git fetch -q "https://github.com/$UPSTREAM_REPO.git" "+refs/heads/main:refs/remotes/upstream/main"
          UPSTREAM=$(git merge-base "$GITHUB_SHA" upstream/main)
          NOTCHCAST_ONLY_TESTS=$(tr '\n' ' ' < "$RUNNER_TEMP/selected")
          export UPSTREAM NOTCHCAST_ONLY_TESTS
          [ -n "${NOTCHCAST_ONLY_TESTS// /}" ] || exit 0
          # run-tests.sh replays no log when bash's crash notice splits its result line, so print it here.
          bash ../tools/notchcast/ci-tests.sh
