name: Main harnesses

# Dispatch only: PR branches get their harnesses from the PR workflow.
on:
  workflow_dispatch:
    inputs:
      hosted_linux:
        description: Run Linux checks on GitHub-hosted runners
        type: boolean
        default: false
      all:
        description: Run every harness, not only the ones the branch changed (load test)
        type: boolean
        default: false
      shards:
        description: Shards for an all run, 1 to 9; each is one more macOS job
        type: number
        default: 1
      hosted:
        description: Run on hosted xcode-27 even while NOTCHCAST_MAC_RUNNER is set (no harness skipped)
        type: boolean
        default: false

permissions:
  contents: read

# One hosted Mac lane for every branch: GitHub keeps one run going and one pending, so only the Keeper dispatches.
concurrency:
  group: main-harnesses
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux-runner: ${{ steps.linux.outputs.runs-on }}
    steps:
      - name: Linux runner availability
        id: linux
        env:
          POOL_FREE: ${{ vars.POOL_FREE_LINUX }}
          FORCE_HOSTED: ${{ inputs.hosted_linux }}
        shell: bash
        run: |
          runner=ubuntu-latest
          if [[ "$FORCE_HOSTED" != true && "$POOL_FREE" =~ ^([1-9][0-9]{0,8})[[:blank:]]([0-9]{10})$ ]]; then
            age=$(( $(date +%s) - 10#${BASH_REMATCH[2]} ))
            if (( age >= 0 && age < 180 )); then runner=linux-pool; fi
          fi
          echo "runs-on=$runner" >> "$GITHUB_OUTPUT"
  # On Linux, so a macOS runner is spent only on shards that have harnesses to run.
  plan:
    needs: route
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.route.outputs.linux-runner == 'linux-pool' && 'linux-pool' || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.shards.outputs.tests }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - name: Prepare clean Linux workspace
        shell: bash
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          fi
          mkdir -p "$RUNNER_TEMP/home"
          printf 'HOME=%s/home\nTMPDIR=%s\nnpm_config_cache=%s/npm\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-python
      - name: Changed harnesses
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.all) }}
        run: |
          git fetch -q origin '+refs/notchcast/synced/*:refs/notchcast/synced/*'
          BEFORE=$(bash notchcast/fork-point.sh origin/main HEAD)
          if python3 notchcast/lanes.py "$BEFORE" "$GITHUB_SHA" | grep -qx build=false; then
            echo "no Xcode lane: the branch changes only docs or scripts the build never reaches (notchcast/lanes.py)"
            : > "$RUNNER_TEMP/selected"
          else
            ./notchcast/changed-harnesses.sh "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/selected"
          fi
          cat "$RUNNER_TEMP/selected"
      # A selection runs in one macOS job: GitHub runs at most 5 at once for the account, across every branch.
      # An all run has no selection: an empty tests output runs the whole suite, split by name over the shards.
      - name: Shards
        id: shards
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
          REQUESTED: ${{ inputs.shards }}
        run: |
          if [ "$ALL" = true ]; then
            case "$REQUESTED" in [1-9]) shards=$REQUESTED ;; *) echo "::error::shards must be 1 to 9, not '$REQUESTED'"; exit 1 ;; esac
            tests=
            echo "all harnesses in $shards shard(s)"
          else
            count=$(grep -c . "$RUNNER_TEMP/selected" || true)
            shards=$(( count > 0 ))
            tests=$(tr '\n' ' ' < "$RUNNER_TEMP/selected")
            echo "$count harnesses in $shards shard(s)"
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 0 $((shards - 1)))]" >> "$GITHUB_OUTPUT"
  # A dispatch only, so never a fork's code: vars.NOTCHCAST_MAC_RUNNER may name a self-hosted Mac (README Runners).
  harnesses:
    needs: plan
    # An empty selection skips this job and the run still concludes success; an empty matrix would fail it.
    if: ${{ needs.plan.outputs.shards != '[]' }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && !inputs.hosted && vars.NOTCHCAST_MAC_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/notchcast/actions/xcode
      - name: Run harnesses
        uses: ./tools/notchcast/actions/tests
        with:
          only: ${{ needs.plan.outputs.tests }}
          shard: ${{ matrix.shard }} ${{ strategy.job-total }}
          cache: push-${{ matrix.shard }}of${{ strategy.job-total }}
      # The render harnesses write PNGs there; a worker without a Mac reads them from this artifact.
      - name: Collect renders
        if: ${{ !cancelled() }}
        run: cp -R "${TMPDIR:-/tmp}/nc-island-audit-renders" "$RUNNER_TEMP/renders" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: island-renders-${{ matrix.shard }}
          path: ${{ runner.temp }}/renders
          if-no-files-found: ignore
