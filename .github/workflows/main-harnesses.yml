name: Main harnesses

# Dispatch only: PR branches get their harnesses from the PR workflow.
on:
  workflow_dispatch:
    inputs:
      all:
        description: Run every harness, not only the ones the branch changed (load test)
        type: boolean
        default: false
      shards:
        description: Shards for an all run, 1 to 9; each is one more macOS job
        type: number
        default: 1
      hosted:
        description: Run on hosted xcode-27 even if a pool Mac is free
        type: boolean
        default: false

permissions:
  contents: read

# One hosted Mac lane for every branch: GitHub keeps one run going and one pending, so only the Keeper dispatches.
concurrency:
  group: main-harnesses
  cancel-in-progress: false

jobs:
  # On Linux, so a macOS runner is spent only on shards that have harnesses to run.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.shards.outputs.tests }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changed harnesses
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.all) }}
        run: |
          git fetch -q origin '+refs/notchcast/synced/*:refs/notchcast/synced/*'
          BEFORE=$(bash notchcast/fork-point.sh origin/main HEAD)
          if python3 notchcast/lanes.py "$BEFORE" "$GITHUB_SHA" | grep -qx build=false; then
            echo "no Xcode lane: the branch changes only docs or scripts the build never reaches (notchcast/lanes.py)"
            : > "$RUNNER_TEMP/selected"
          else
            ./notchcast/changed-harnesses.sh "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/selected"
          fi
          cat "$RUNNER_TEMP/selected"
      # A selection runs in one macOS job: GitHub runs at most 5 at once for the account, across every branch.
      # An all run has no selection: an empty tests output runs the whole suite, split by name over the shards.
      - name: Shards
        id: shards
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
          REQUESTED: ${{ inputs.shards }}
        run: |
          if [ "$ALL" = true ]; then
            case "$REQUESTED" in [1-9]) shards=$REQUESTED ;; *) echo "::error::shards must be 1 to 9, not '$REQUESTED'"; exit 1 ;; esac
            tests=
            echo "all harnesses in $shards shard(s)"
          else
            count=$(grep -c . "$RUNNER_TEMP/selected" || true)
            shards=$(( count > 0 ))
            tests=$(tr '\n' ' ' < "$RUNNER_TEMP/selected")
            echo "$count harnesses in $shards shard(s)"
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 0 $((shards - 1)))]" >> "$GITHUB_OUTPUT"
  # The branch's planning scripts must never share a runner with the Mac decision.
  mac-route:
    needs: plan
    if: ${{ !inputs.hosted && !inputs.all && vars.POOL_FREE_NOTCHCAST_MAC != '' && needs.plan.outputs.tests != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mac-runner: ${{ steps.mac.outputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Route the selected Mac harnesses
        id: mac
        env:
          LC_ALL: C
          POOL_FREE: ${{ vars.POOL_FREE_NOTCHCAST_MAC }}
          TESTS: ${{ needs.plan.outputs.tests }}
        shell: bash
        run: |
          main=refs/remotes/origin/main
          base_config=$(git show "$main:notchcast/config.env") || exit 0
          MAINTAINER_LOGIN=$(sed -n 's/^MAINTAINER_LOGIN=\([a-zA-Z0-9-][a-zA-Z0-9-]*\)$/\1/p' <<< "$base_config")
          fork_repo=$(sed -n 's/^FORK_REPO=\(.*\)$/\1/p' <<< "$base_config")
          [[ "$GITHUB_REPOSITORY" == "$fork_repo" && "$GITHUB_REF_TYPE" == branch &&
             "$GITHUB_ACTOR" == "$MAINTAINER_LOGIN" && "$GITHUB_TRIGGERING_ACTOR" == "$MAINTAINER_LOGIN" ]] || exit 0

          git diff --quiet --no-ext-diff --no-textconv --ignore-submodules=none "$main" "$GITHUB_SHA" -- . \
            ':(exclude,glob,top)Tinycast/**/*.swift' ':(exclude,glob,top)Tests/**/*.swift' || exit 0

          [[ "$POOL_FREE" =~ ^([1-9][0-9]{0,8})[[:blank:]]([0-9]{10})$ ]] || exit 0
          age=$(( $(date +%s) - 10#${BASH_REMATCH[2]} ))
          (( age >= 0 && age < 180 )) || exit 0

          names='^[a-zA-Z0-9_+-]+( [a-zA-Z0-9_+-]+)* *$'
          [[ "$TESTS" =~ $names ]] || exit 0
          read -ra selected <<< "$TESTS"
          list='^(HOSTED_ONLY_TESTS|CI_SKIP_TESTS)="([a-zA-Z0-9_+ -]*)"$'
          read -ra blocked <<< "$(sed -En "s/$list/\2/p" <<< "$base_config" | paste -sd' ' -)"
          blocked_paths=()
          for test in "${blocked[@]}"; do blocked_paths+=("Tests/$test.swift"); done
          tag='^// notchcast-(hosted-only|ci-skip)$'
          blocked_blobs=' '
          for tree in "$main" "$GITHUB_SHA"; do
            tagged=$(git grep -a -l -E "$tag" "$tree" -- ':(top,glob)Tests/*.swift') || [[ $? == 1 ]] || exit 0
            paths=("${blocked_paths[@]}")
            while IFS= read -r match; do
              [[ -n "$match" ]] || continue
              [[ "$match" == "$tree":Tests/* ]] || exit 0
              paths+=("${match#*:}")
            done <<< "$tagged"
            (( ${#paths[@]} )) || continue
            entries=$(git --literal-pathspecs ls-tree --format='%(objecttype) %(objectname)' "$tree" -- "${paths[@]}") || exit 0
            while read -r type blob; do
              [[ -n "$type" ]] || continue
              [[ "$type" == blob && -n "$blob" ]] || exit 0
              blocked_blobs+="$blob "
            done <<< "$entries"
          done
          risky=$(git show "$main:notchcast/ci-tests-test.sh" | sed -n "s/^risky='\(.*\)'$/\1/p") || exit 0
          [[ 'NSWindow(' =~ $risky && -n "$risky" ]] || exit 0
          for test in "${selected[@]}"; do
            path="Tests/$test.swift"
            for tree in "$GITHUB_SHA" "$main"; do
              entry=$(git ls-tree --format='%(objectmode) %(objecttype) %(objectname)' "$tree" -- "$path") || exit 0
              if [[ "$tree" == "$main" && -z "$entry" ]]; then continue; fi
              read -r mode type blob <<< "$entry"
              [[ "$mode" == 100??? && "$type" == blob && -n "$blob" ]] || exit 0
              [[ "$blocked_blobs" != *" $blob "* ]] || exit 0
              harness=$(git show "$blob") || exit 0
              grep -Eaq "$risky|$tag" <<< "$harness" && exit 0
              [[ $? == 1 ]] || exit 0
            done
          done
          echo "runs-on=notchcast-mbp" >> "$GITHUB_OUTPUT"
  harnesses:
    needs: [plan, mac-route]
    # The status check lets a skipped route leave planned shards eligible for hosted execution.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.shards != '[]' }}
    runs-on: ${{ needs.mac-route.result == 'success' && needs.mac-route.outputs.mac-runner == 'notchcast-mbp' && 'notchcast-mbp' || 'xcode-27' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/notchcast/actions/xcode
      - name: Run harnesses
        uses: ./tools/notchcast/actions/tests
        with:
          only: ${{ needs.plan.outputs.tests }}
          shard: ${{ matrix.shard }} ${{ strategy.job-total }}
          cache: push-${{ matrix.shard }}of${{ strategy.job-total }}
      # The render harnesses write PNGs there; a worker without a Mac reads them from this artifact.
      - name: Collect renders
        if: ${{ !cancelled() }}
        run: cp -R "${TMPDIR:-/tmp}/nc-island-audit-renders" "$RUNNER_TEMP/renders" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: island-renders-${{ matrix.shard }}
          path: ${{ runner.temp }}/renders
          if-no-files-found: ignore
