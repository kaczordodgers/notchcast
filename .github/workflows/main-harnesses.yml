name: Main harnesses

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - Tinycast.xcodeproj/project.pbxproj
      - Tinycast.xcodeproj/xcshareddata/xcschemes/Tinycast.xcscheme
      - Tinycast/Resources/RaycastRuntime.generated.js
      - README.md

permissions:
  actions: read
  contents: read
  issues: write

# Running checks finish; pending pushes select from the last green run to cover replaced pushes.
concurrency:
  group: main-harnesses-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harnesses:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/notchcast/actions/xcode
      - name: Changed harnesses
        working-directory: src
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin '+refs/notchcast/synced/*:refs/notchcast/synced/*'
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            BEFORE=$(bash notchcast/fork-point.sh origin/main HEAD)
          else
            BEFORE=$(bash notchcast/main-harness-base.sh "$BEFORE" "$GITHUB_SHA")
          fi
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}"; then
            # A Sync rewrite: Sync tested this tree before pushing it.
            echo notchcast-core-test > "$RUNNER_TEMP/selected"
          else
            ./notchcast/changed-harnesses.sh "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/selected"
          fi
          cat "$RUNNER_TEMP/selected"
      - name: Run harnesses, retry failures alone
        working-directory: src
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: '1'
          NOTCHCAST_TEST_HELPER_EXECUTABLE: '1'
        run: |
          export TMPDIR="$RUNNER_TEMP/main-harnesses"
          mkdir -p "$TMPDIR"
          source ../tools/notchcast/config.env
          git fetch -q "https://github.com/$UPSTREAM_REPO.git" "+refs/heads/main:refs/remotes/upstream/main"
          UPSTREAM=$(git merge-base "$GITHUB_SHA" upstream/main)
          NOTCHCAST_ONLY_TESTS=$(tr '\n' ' ' < "$RUNNER_TEMP/selected")
          export UPSTREAM NOTCHCAST_ONLY_TESTS
          [ -n "${NOTCHCAST_ONLY_TESTS// /}" ] || exit 0
          # run-tests.sh replays no log when bash's crash notice splits its result line, so print it here.
          bash ../tools/notchcast/ci-tests.sh
      # land.sh pushes its own squash with no app build on the merged tree; a red main opens the notchcast-main
      # issue, which the maintainer's updater turns into one alert (the next green Sync of main closes it).
      - name: Report a red main
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/notchcast/ci.py issue open main "main ${GITHUB_SHA:0:7} fails its harnesses" "harnesses-$GITHUB_SHA"
