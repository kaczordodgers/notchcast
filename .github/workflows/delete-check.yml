# The add-on delete test (notchcast/docs/addons.md §5): one hosted macOS job runs every add-on folder in turn.
name: Delete check

on:
  workflow_dispatch:
    inputs:
      hosted_linux:
        description: Run Linux checks on GitHub-hosted runners
        type: boolean
        default: false
      ref:
        description: Commit or branch whose add-on folders are deleted one at a time
        required: true

permissions:
  contents: read

concurrency:
  group: delete-check-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux-runner: ${{ steps.linux.outputs.runs-on }}
    steps:
      - name: Linux runner availability
        id: linux
        env:
          POOL_FREE: ${{ vars.POOL_FREE_LINUX }}
          FORCE_HOSTED: ${{ inputs.hosted_linux }}
        shell: bash
        run: |
          runner=ubuntu-latest
          if [[ "$FORCE_HOSTED" != true && "$POOL_FREE" =~ ^([1-9][0-9]{0,8})[[:blank:]]([0-9]{10})$ ]]; then
            age=$(( $(date +%s) - 10#${BASH_REMATCH[2]} ))
            if (( age >= 0 && age < 180 )); then runner=linux-pool; fi
          fi
          echo "runs-on=$runner" >> "$GITHUB_OUTPUT"
  plan:
    needs: route
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.route.outputs.linux-runner == 'linux-pool' && 'linux-pool' || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.list.outputs.sha }}
      folders: ${{ steps.list.outputs.folders }}
    steps:
      - name: Prepare clean Linux workspace
        shell: bash
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          fi
          mkdir -p "$RUNNER_TEMP/home"
          printf 'HOME=%s/home\nTMPDIR=%s\nnpm_config_cache=%s/npm\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned jq
        shell: bash
        run: |
          curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64 -o "$RUNNER_TEMP/jq"
          echo "020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d  $RUNNER_TEMP/jq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/jq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-python
      - id: list
        env:
          REF: ${{ inputs.ref }}
        run: |
          git fetch -q --no-tags origin "$REF"
          sha=$(git rev-parse FETCH_HEAD)
          folders=$(python3 notchcast/check-addon-delete.py --list --ref "$sha" | jq -Rnc '[inputs]')
          echo "$REF is $sha: $folders"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "folders=$folders" >> "$GITHUB_OUTPUT"
  delete:
    needs: plan
    if: ${{ needs.plan.outputs.folders != '[]' }}
    runs-on: xcode-27
    # One macOS job for every folder, in turn (about 15 minutes each): GitHub runs 5 at once for the account.
    timeout-minutes: 360
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      FOLDERS: ${{ needs.plan.outputs.folders }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./notchcast/actions/xcode
      - uses: ./notchcast/actions/xcodegen
      # A failing folder never stops the rest: each gets its verdict line, and the step fails at the end.
      - name: Delete each add-on folder
        shell: bash
        run: |
          git fetch -q --no-tags origin "$SHA"
          set -a; source notchcast/config.env; set +a
          export LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 NOTCHCAST_TEST_HELPER_EXECUTABLE=1
          echo "DELETE_LOGS=$HOME/Library/Caches/notchcast/addon-delete" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/result"
          failed=0
          for FOLDER in $(jq -r '.[]' <<< "$FOLDERS"); do
            echo "::group::$FOLDER"
            code=0
            python3 notchcast/check-addon-delete.py --ref "$SHA" -- "$FOLDER" | tee "$RUNNER_TEMP/out" || code=${PIPESTATUS[0]}
            line=$(grep -E '^(PASS|FAIL) delete' "$RUNNER_TEMP/out" | tail -n1 || true)
            printf '%s\t%s\t%s\n' "$FOLDER" "$code" "${line:-no verdict line}" > "$RUNNER_TEMP/result/$FOLDER.tsv"
            echo "::endgroup::"
            echo "$FOLDER: ${line:-no verdict line} (exit $code)"
            [ "$code" -eq 0 ] || failed=1
          done
          exit "$failed"
      - name: Upload result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: results
          path: ${{ runner.temp }}/result/
          if-no-files-found: ignore
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: logs
          path: ${{ env.DELETE_LOGS }}/*.log
          if-no-files-found: ignore
  summary:
    needs: [route, plan, delete]
    if: ${{ !cancelled() }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.route.outputs.linux-runner == 'linux-pool' && 'linux-pool' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Prepare clean Linux workspace
        shell: bash
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          fi
          mkdir -p "$RUNNER_TEMP/home"
          printf 'HOME=%s/home\nTMPDIR=%s\nnpm_config_cache=%s/npm\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned jq
        shell: bash
        run: |
          curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64 -o "$RUNNER_TEMP/jq"
          echo "020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d  $RUNNER_TEMP/jq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/jq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: results
          path: ${{ runner.temp }}/results
      - env:
          SHA: ${{ needs.plan.outputs.sha }}
          FOLDERS: ${{ needs.plan.outputs.folders }}
          PLAN: ${{ needs.plan.result }}
        shell: bash
        run: |
          [ "$PLAN" = success ] || { echo "::error::plan $PLAN"; exit 1; }
          table="$RUNNER_TEMP/table.md"
          {
            echo "### Delete check at ${SHA:0:12}"
            echo
            echo "| Folder | Result | Line |"
            echo "| --- | --- | --- |"
            for folder in $(jq -r '.[]' <<< "$FOLDERS"); do
              file="$RUNNER_TEMP/results/$folder.tsv"
              if [ -f "$file" ]; then IFS=$'\t' read -r _ code line < "$file"; else code=none line='no result: the job stopped before this folder finished'; fi
              case "$code" in 0) result=PASS ;; 1) result='FAIL breach' ;; *) result='FAIL tooling' ;; esac
              echo "| $folder | $result | ${line//|/\\|} |"
            done
          } > "$table"
          tee -a "$GITHUB_STEP_SUMMARY" < "$table"
          ! grep -q '| FAIL ' "$table"
