name: Proof
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosted_linux:
        description: Run Linux checks on GitHub-hosted runners
        type: boolean
        default: false
      checks:
        description: Space-separated checks, or all
        default: all
      base:
        description: Base commit to plan against, as a PR's base (notchcast/train.sh); overrides checks
        default: ''
      hosted:
        description: Run the macOS job on hosted xcode-27 even while NOTCHCAST_MAC_RUNNER is set
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || github.event.pull_request.head.label || format('{0}:{1}', github.repository_owner, github.ref_name) }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux-runner: ${{ steps.linux.outputs.runs-on }}
    steps:
      - name: Linux runner availability
        id: linux
        env:
          POOL_FREE: ${{ vars.POOL_FREE_LINUX }}
          FORCE_HOSTED: ${{ inputs.hosted_linux }}
        shell: bash
        run: |
          runner=ubuntu-latest
          if [[ "$FORCE_HOSTED" != true && "$POOL_FREE" =~ ^([1-9][0-9]{0,8})[[:blank:]]([0-9]{10})$ ]]; then
            age=$(( $(date +%s) - 10#${BASH_REMATCH[2]} ))
            if (( age >= 0 && age < 180 )); then runner=linux-pool; fi
          fi
          echo "runs-on=$runner" >> "$GITHUB_OUTPUT"
  plan:
    needs: route
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.route.outputs.linux-runner == 'linux-pool' && 'linux-pool' || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - name: Prepare clean Linux workspace
        shell: bash
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          fi
          mkdir -p "$RUNNER_TEMP/home"
          printf 'HOME=%s/home\nTMPDIR=%s\nnpm_config_cache=%s/npm\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-python
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          CHECKS: ${{ inputs.checks || 'all' }}
        run: |
          set -o pipefail
          if [ -n "$BASE" ]; then
            checks=$(python3 notchcast/app-proof.py plan "$BASE" HEAD | paste -sd ' ' -)
          elif [ "$CHECKS" = all ]; then
            checks=$(python3 -c 'import json; print(" ".join(json.load(open("notchcast/app-proofs.json"))))')
          else
            checks=$CHECKS
          fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
  proof:
    needs: plan
    if: needs.plan.outputs.checks != ''
    # Only a dispatch reaches vars.NOTCHCAST_MAC_RUNNER, a self-hosted Mac: a pull_request, a fork's too, stays hosted.
    runs-on: ${{ github.event_name == 'workflow_dispatch' && !inputs.hosted && vars.NOTCHCAST_MAC_RUNNER || 'xcode-27' }}
    timeout-minutes: 120
    steps:
      - name: Refuse a working Mac
        if: runner.environment != 'github-hosted'
        run: |
          [ "${NOTCHCAST_ISOLATED_RUNNER:-}" = 1 ] && exit 0
          echo "::error::Proof launches the app: hosted or isolated runner only"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./notchcast/actions/xcode
      - uses: ./notchcast/actions/xcodegen
      - name: Regenerate project
        run: '"$XCODEGEN" generate --quiet'
      - name: Run Release app proofs
        env:
          CHECKS: ${{ needs.plan.outputs.checks }}
        run: python3 notchcast/app-proof.py run $CHECKS
