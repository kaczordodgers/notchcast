# UI mistakes our commits add to the SwiftUI code (enmerasoftware/ai-design-check, see notchcast/design-check.sh).
name: Design

on:
  push:
    branches: [main]
    paths: ["**/*.swift", "notchcast/design-check.sh", "notchcast/config.env", ".github/workflows/design.yml"]
  pull_request:
    branches: [main]
    paths: ["**/*.swift", "notchcast/design-check.sh", "notchcast/config.env", ".github/workflows/design.yml"]

permissions:
  contents: read

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Findings upstream already has are the baseline; only what our commits add is reported.
      - name: ai-design-check on our changes
        run: |
          git fetch -q https://github.com/abue-ammar/tinycast.git "+refs/heads/main:refs/remotes/upstream/main"
          notchcast/design-check.sh "$(git merge-base HEAD refs/remotes/upstream/main)"
