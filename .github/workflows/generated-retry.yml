name: Retry Generated files runner allocation

on:
  workflow_run:
    workflows: [Generated files]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  checks: read

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...repo, run_id: run.id, attempt_number: run.run_attempt, per_page: 100
            });
            if (jobs.length !== 1) return;
            const job = jobs[0];
            if (job.name !== 'regenerate' || job.conclusion !== 'cancelled') return;
            if ((job.steps || []).some(step => step.started_at)) return;
            const check_run_id = Number(job.check_run_url.split('/').pop());
            const annotations = await github.paginate(github.rest.checks.listAnnotations, {
              ...repo, check_run_id, per_page: 100
            });
            if (!annotations.some(annotation => annotation.message.includes(
              'The job was not acquired by Runner of type hosted even after multiple attempts'
            ))) return;
            await github.rest.actions.reRunWorkflow({...repo, run_id: run.id});
            core.notice(`Retrying Generated files runner allocation after attempt ${run.run_attempt}`);
