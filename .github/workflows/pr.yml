# Build and run upstream's harnesses on every PR to main, the same way Sync tests main. Nothing is pushed.
name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/notchcast/actions/xcode
      - uses: ./tools/notchcast/actions/xcodegen
      - name: Project is generated from project.yml
        working-directory: src
        run: |
          "$XCODEGEN" generate --quiet
          git diff --exit-code -- Tinycast.xcodeproj || { echo "::error::Tinycast.xcodeproj differs from xcodegen output; run xcodegen generate"; exit 1; }
      - name: Upstream base
        id: base
        working-directory: src
        run: |
          git fetch -q https://github.com/abue-ammar/tinycast.git "+refs/heads/main:refs/remotes/upstream/main"
          echo "sha=$(git merge-base HEAD refs/remotes/upstream/main)" >> "$GITHUB_OUTPUT"
      - name: Build (Debug, unsigned)
        working-directory: src
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Lint
        working-directory: src
        run: |
          command -v swiftlint >/dev/null || brew install --quiet swiftlint
          ./Scripts/lint.sh
      - uses: ./tools/notchcast/actions/tests
        with:
          upstream: ${{ steps.base.outputs.sha }}
