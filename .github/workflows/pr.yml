# Build and run upstream's harnesses on every PR to main, the same way Sync tests main. Nothing is pushed.
name: PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      hosted_linux:
        description: Run Linux checks on GitHub-hosted runners
        type: boolean
        default: false
      base:
        description: Base commit the checks compare against, as a PR's base (notchcast/train.sh)
        default: ''
      hosted:
        description: Run the macOS job on hosted xcode-27 even while NOTCHCAST_MAC_RUNNER is set (full proof)
        type: boolean
        default: false
      harness_runner:
        description: Runner label for a harness-only macOS job (notchcast-mba, notchcast-mbp); no build, no proof of any tree (README, Runners)
        type: choice
        options: ['', notchcast-mba, notchcast-mbp]
        default: ''

permissions:
  contents: read

# on: a PR's mac job runs only a sure harness selection (notchcast/harness-select.py); an unsure one runs the whole suite.
# A dispatch (a train) always runs it whole: land.sh takes that run as proof of the train's tree.
env:
  NOTCHCAST_HARNESS_SELECT: ${{ github.event_name == 'pull_request' && 'on' || 'shadow' }}

# One group per workflow and PR head: a dispatch and a pull_request run on one head never both run. A harness-only
# run has a group of its own, so it never cancels the head's real run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || github.event.pull_request.head.label || format('{0}:{1}', github.repository_owner, github.ref_name) }}${{ inputs.harness_runner && format('-{0}', inputs.harness_runner) || '' }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  # On Linux: names the lanes the diff needs (notchcast/lanes.py): a skipped one still reports, and build accepts it.
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux-runner: ${{ steps.linux.outputs.runs-on }}
      build: ${{ steps.lanes.outputs.build }}
      scripts: ${{ steps.lanes.outputs.scripts }}
      harness-planned: ${{ steps.select.outputs.planned }}
      harness-selected: ${{ steps.select.outputs.selected }}
      harness-unsure: ${{ steps.select.outputs.unsure }}
      harness-only: ${{ steps.select.outputs.only }}
    steps:
      - name: Linux runner availability
        id: linux
        env:
          POOL_FREE: ${{ vars.POOL_FREE_LINUX }}
          FORCE_HOSTED: ${{ inputs.hosted_linux }}
        shell: bash
        run: |
          runner=ubuntu-latest
          if [[ "$FORCE_HOSTED" != true && "$POOL_FREE" =~ ^([1-9][0-9]{0,8})[[:blank:]]([0-9]{10})$ ]]; then
            age=$(( $(date +%s) - 10#${BASH_REMATCH[2]} ))
            if (( age >= 0 && age < 180 )); then runner=linux-pool; fi
          fi
          echo "runs-on=$runner" >> "$GITHUB_OUTPUT"
      # train.sh reads a train's PR run by its conclusion alone, and a harness-only run builds nothing.
      - name: A harness-only run is never a train's
        if: inputs.harness_runner != '' && startsWith(github.ref, 'refs/heads/train/')
        run: |
          echo "::error::harness_runner on a train branch: a harness-only run proves no tree"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: notchcast
          fetch-depth: 0
          persist-credentials: false
      - name: Lanes the diff needs
        id: lanes
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        shell: bash
        run: |
          case "$GITHUB_HEAD_REF" in
            v2/addons-*) printf 'build=true\nscripts=true\n' | tee -a "$GITHUB_OUTPUT" ;;
            *) python3 notchcast/lanes.py "${BASE:-$(git merge-base origin/main HEAD)}" HEAD | tee -a "$GITHUB_OUTPUT" ;;
          esac
      # Never fails the run: with no plan the mac job runs the whole suite.
      - name: Harnesses the diff needs
        id: select
        if: steps.lanes.outputs.build == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        shell: bash
        run: |
          git sparse-checkout disable
          python3 notchcast/harness-select.py plan "${BASE:-$(git merge-base origin/main HEAD)}" HEAD
  # The one macOS job of a run: GitHub runs at most 5 at once for the account, so every lane that needs a Mac runs here in turn.
  # Only a dispatch reaches vars.NOTCHCAST_MAC_RUNNER, a self-hosted Mac: a pull_request, a fork's too, stays hosted.
  # inputs.harness_runner names the runner of a harness-only job: the harness steps alone, and no other job of the run.
  mac:
    needs: route
    if: needs.route.outputs.scripts == 'true' || inputs.harness_runner != ''
    runs-on: ${{ github.event_name == 'workflow_dispatch' && (inputs.harness_runner || !inputs.hosted && vars.NOTCHCAST_MAC_RUNNER) || 'xcode-27' }}
    timeout-minutes: 90
    outputs:
      kind: ${{ steps.runner.outputs.kind }}
      toolchain: ${{ steps.proved.outputs.toolchain }}
      excused: ${{ steps.proved.outputs.excused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/notchcast/actions/xcode
        if: inputs.harness_runner == ''
      # A sandboxed runner cannot run xcodebuild: it names its Xcode in DEVELOPER_DIR, and the version file answers.
      - name: The harness runner's own Xcode
        if: inputs.harness_runner != ''
        env:
          NOTCHCAST_XCODE_FROM_RUNNER: '1'
        run: bash tools/notchcast/ci-xcode.sh
      # hosted is GitHub's VM and isolated a Mac user of its own (README, Runners): both run everything. working is a
      # maintainer's own session: its run skips what could touch that Mac and proves no tree. A harness-only run is
      # working on any runner: it never builds, so it never records a tree.
      - name: Runner kind
        id: runner
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          HARNESS_ONLY: ${{ inputs.harness_runner != '' }}
        run: |
          kind=working
          if [ "$HOSTED" = true ]; then kind=hosted; elif [ "${NOTCHCAST_ISOLATED_RUNNER:-}" = 1 ]; then kind=isolated; fi
          if [ "$HARNESS_ONLY" = true ]; then kind=working; echo "::notice::SKIPPED on a harness-only run: the build lane, every Linux job, the build check"; fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          [ "$kind" != working ] || echo "::notice::SKIPPED on a working Mac: the macOS script tests, HOSTED_ONLY_TESTS harnesses, the tested-tree record"
      # Runners of one Mac share its temp folder: each job keeps its harness logs in its own. The figures only print.
      - name: Runner load at start
        if: steps.runner.outputs.kind != 'hosted'
        run: |
          mkdir -p "$RUNNER_TEMP/tmp" && echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          sysctl -n hw.ncpu hw.memsize; uptime; vm_stat | head -8; sysctl vm.swapusage
      # Each test gets its own TMPDIR so it can run beside the Debug build.
      - name: Script tests that need macOS
        if: steps.runner.outputs.kind != 'working'
        working-directory: src
        run: |
          out="$RUNNER_TEMP/macos-script-tests"
          mkdir "$out"
          perl -MFcntl=:flock -MPOSIX=setsid -e '
            my ($out, $limit) = splice @ARGV, 0, 2;
            open my $lock, ">>", "$out/lock" or die "lock: $!";
            flock $lock, LOCK_EX or die "flock: $!";
            defined(my $daemon = fork) or die "fork: $!";
            exit 0 if $daemon;  # the held lock goes with the daemon: the result step waits on it, never a poll
            setsid;
            open STDIN, "<", "/dev/null"; open STDOUT, ">", "$out/log"; open STDERR, ">&", \*STDOUT; $| = 1;
            defined(my $pid = fork) or die "fork: $!";
            if (!$pid) { setpgrp(0, 0); exec @ARGV or die "exec: $!" }
            setpgrp($pid, $pid);
            sub finish { kill "KILL", -$pid; open my $rc, ">", "$out/rc" or die "rc: $!"; print $rc "$_[0]\n"; exit 0 }
            $SIG{ALRM} = sub { kill "KILL", -$pid; waitpid($pid, 0); print "\nStopped: passed ${limit}s\n"; finish(124) };
            alarm $limit; waitpid($pid, 0); alarm 0;
            finish($? & 127 ? 128 + ($? & 127) : $? >> 8)' "$out" 600 nice -n 10 bash -c \
            'bash notchcast/fetch-upstream.sh --no-tags && python3 notchcast/script-tests.py --all --runner macos'
      - name: Shared PR build lane
        if: needs.route.outputs.build == 'true' && inputs.harness_runner == ''
        working-directory: src
        timeout-minutes: 35
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NOTCHCAST_HARNESSES_SHARDED: '1'
        run: bash ../tools/notchcast/ci-build.sh
      # Also after a failed or skipped build lane; a run cancelled meanwhile never reaches it, so never passes.
      - name: Result of the script tests that need macOS
        if: ${{ !cancelled() && steps.runner.outputs.kind != 'working' }}
        timeout-minutes: 10
        run: |
          out="$RUNNER_TEMP/macos-script-tests"
          perl -MFcntl=:flock -e 'open my $lock, "<", shift or die "lock: $!"; flock $lock, LOCK_EX or die "flock: $!"' "$out/lock"
          cat "$out/log"
          rc=$(cat "$out/rc") || { echo "::error::the macOS script tests left no result"; exit 1; }
          [ "$rc" = 0 ] || { echo "::error::macOS script tests failed ($rc)"; exit "$rc"; }
      # The whole suite (notchcast/test-harnesses.sh), or route's sure selection, after the build lane rather than in a
      # job beside it. A selection's cache is its own; a harness_runner run's is none: its key would start xcodebuild.
      - id: tests
        if: needs.route.outputs.build == 'true' || inputs.harness_runner != ''
        timeout-minutes: 60
        uses: ./tools/notchcast/actions/tests
        with:
          only: ${{ needs.route.outputs.harness-only }}
          cache: ${{ inputs.harness_runner == '' && (needs.route.outputs.harness-only == '' && 'pr-0of1' || 'pr-select') || '' }}
      # Only a run of the whole suite can find one: a selection ran nothing outside itself.
      - name: Failures outside the harness selection
        if: ${{ !cancelled() && needs.route.outputs.build == 'true' && needs.route.outputs.harness-only == '' }}
        continue-on-error: true
        env:
          HARNESS_PLANNED: ${{ needs.route.outputs.harness-planned }}
          HARNESS_SELECTED: ${{ needs.route.outputs.harness-selected }}
          HARNESS_UNSURE: ${{ needs.route.outputs.harness-unsure }}
          HARNESS_TESTS: ${{ steps.tests.outcome }}
        run: python3 tools/notchcast/harness-select.py misses "$RUNNER_TEMP/harness-failures" 0
      - name: Runner load at end
        if: ${{ !cancelled() && steps.runner.outputs.kind != 'hosted' }}
        run: sysctl -n hw.ncpu hw.memsize; uptime; vm_stat | head -8; sysctl vm.swapusage
      # For the tested-tree record: the toolchain, and the harnesses red here and on upstream, which this run proved nowhere.
      - name: What the isolated runner proved
        id: proved
        if: steps.runner.outputs.kind == 'isolated' && needs.route.outputs.build == 'true'
        run: |
          echo "toolchain=$({ xcodebuild -version; sw_vers; } | tr -s '\t\n' ' ' | sed 's/ $//')" >> "$GITHUB_OUTPUT"
          echo "excused=$(paste -sd' ' "$RUNNER_TEMP/harness-excused")" >> "$GITHUB_OUTPUT"
  # ci-build.sh's checks that need no Mac (notchcast/ci-checks.sh), beside mac.
  linux-checks:
    needs: route
    if: needs.route.outputs.build == 'true' && inputs.harness_runner == ''
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.route.outputs.linux-runner == 'linux-pool' && 'linux-pool' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Prepare clean Linux workspace
        shell: bash
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          fi
          mkdir -p "$RUNNER_TEMP/home"
          printf 'HOME=%s/home\nTMPDIR=%s\nnpm_config_cache=%s/npm\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-python
      - name: Checks that need no Mac
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash notchcast/ci-checks.sh
  # On Linux, in parallel (notchcast/script-tests.py); a test marked as needing macOS runs in mac instead.
  script-tests:
    needs: route
    if: needs.route.outputs.scripts == 'true' && inputs.harness_runner == ''
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.route.outputs.linux-runner == 'linux-pool' && 'linux-pool' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Prepare clean Linux workspace
        shell: bash
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          fi
          mkdir -p "$RUNNER_TEMP/home"
          printf 'HOME=%s/home\nTMPDIR=%s\nnpm_config_cache=%s/npm\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install pinned jq
        shell: bash
        run: |
          curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64 -o "$RUNNER_TEMP/jq"
          echo "020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d  $RUNNER_TEMP/jq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/jq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-python
      - uses: ./.github/actions/linux-node
        with:
          version: '24.22.3'
          sha256: 4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb
      - uses: ./.github/actions/linux-swift
      - name: Install pinned Ruby
        shell: bash
        env:
          RUBY_VERSION: '4.0.10'
          RUBY_SHA256: ca54d2d9204f9f9724f7aa1620b30538723da3a9365d9195951b82fa6765fd4e
        run: |
          archive="$RUNNER_TEMP/ruby.tar.gz"
          curl -fsSL "https://github.com/jdx/ruby/releases/download/$RUBY_VERSION/ruby-$RUBY_VERSION.x86_64_linux.tar.gz" -o "$archive"
          printf '%s  %s\n' "$RUBY_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          ruby_bin="$RUNNER_TEMP/ruby-$RUBY_VERSION/bin"
          "$ruby_bin/ruby" --version
          echo "$ruby_bin" >> "$GITHUB_PATH"
      - name: Install pinned Gitleaks
        shell: bash
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tgz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Script tests
        run: python3 notchcast/script-tests.py --all --runner linux
  # mac also runs the selected Linux-compatible harnesses against the macOS SDK.
  linux-harnesses:
    needs: route
    if: needs.route.outputs.build == 'true' && inputs.harness_runner == ''
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.route.outputs.linux-runner == 'linux-pool' && 'linux-pool' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Prepare clean Linux workspace
        shell: bash
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          fi
          mkdir -p "$RUNNER_TEMP/home"
          printf 'HOME=%s/home\nTMPDIR=%s\nnpm_config_cache=%s/npm\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-swift
      # An unsure or missing selection runs every linux-ok harness; run-tests.sh names the mac-only ones it skips.
      - name: Linux-ok harnesses the diff needs
        env:
          HARNESS_SELECTED: ${{ needs.route.outputs.harness-selected }}
          HARNESS_UNSURE: ${{ needs.route.outputs.harness-unsure }}
        run: |
          if [ -n "$HARNESS_SELECTED" ] && [ -z "$HARNESS_UNSURE" ]; then export NOTCHCAST_ONLY_TESTS="$HARNESS_SELECTED"; fi
          ./Scripts/run-tests.sh
  # land.sh reads the check named build: green only when every lane the diff needs is. A harness-only run has none:
  # its skipped build check is no proof to land.sh, and a real run's check on that head still counts (merge.sh).
  build:
    needs: [route, mac, linux-checks, linux-harnesses, script-tests]
    if: ${{ !cancelled() && inputs.harness_runner == '' }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.route.outputs.linux-runner == 'linux-pool' && 'linux-pool' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Prepare clean Linux workspace
        shell: bash
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
          fi
          mkdir -p "$RUNNER_TEMP/home"
          printf 'HOME=%s/home\nTMPDIR=%s\nnpm_config_cache=%s/npm\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: A train run names its base
        if: startsWith(github.ref, 'refs/heads/train/') && inputs.base == ''
        run: |
          echo "::error::train branches are dispatched by notchcast/train.sh with -f base=<main sha>"
          exit 1
      - name: A train's Mac job proves its tree
        if: startsWith(github.ref, 'refs/heads/train/') && needs.mac.outputs.kind == 'working'
        run: |
          echo "::error::this train's Mac job ran on a working Mac, which skips tests and proves no tree"
          exit 1
      - name: Every lane the diff needs passed, and only those were skipped
        env:
          ROUTE: ${{ needs.route.result }}
          BUILD: ${{ needs.route.outputs.build }}
          SCRIPTS: ${{ needs.route.outputs.scripts }}
          MAC: ${{ needs.mac.result }}
          LINUX_CHECKS: ${{ needs.linux-checks.result }}
          LINUX_HARNESSES: ${{ needs.linux-harnesses.result }}
          SCRIPT_TESTS: ${{ needs.script-tests.result }}
        run: |
          case "$BUILD:$SCRIPTS" in true:true|false:true|false:false) ;; *) echo "::error::lanes said '$BUILD' '$SCRIPTS'"; exit 1;; esac
          want() { if [ "$1" = true ]; then echo success; else echo skipped; fi; }
          if [ "$ROUTE" != success ] || [ "$MAC" != "$(want "$SCRIPTS")" ] || [ "$LINUX_CHECKS" != "$(want "$BUILD")" ] \
              || [ "$LINUX_HARNESSES" != "$(want "$BUILD")" ] || [ "$SCRIPT_TESTS" != "$(want "$SCRIPTS")" ]; then
            echo "::error::route: $ROUTE (build $BUILD, scripts $SCRIPTS), mac: $MAC, linux checks: $LINUX_CHECKS, linux harnesses: $LINUX_HARNESSES, script tests: $SCRIPT_TESTS"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-python
      # check-config reads every notchcast/ file, docs too; linux-checks runs it when the build lane does.
      - name: Config literals
        if: needs.route.outputs.build != 'true'
        run: python3 notchcast/check-config.py
      # Only after a green build of the whole suite: a selection proves no tree, so it records none.
      # Hosted: Sync's plan skips testing a tree (GENERATED aside) a PR build already proved.
      # Isolated: a record of its own name with the runner's stamp, which only land.sh reads and judges (README, Runners).
      - name: Record the tested tree
        if: needs.route.outputs.build == 'true' && needs.mac.outputs.kind != 'working' && needs.route.outputs.harness-only == ''
        id: tree
        env:
          KIND: ${{ needs.mac.outputs.kind }}
          TOOLCHAIN: ${{ needs.mac.outputs.toolchain }}
          EXCUSED: ${{ needs.mac.outputs.excused }}
        run: |
          echo "key=$(python3 notchcast/ci.py tested-key HEAD)" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/tested"
          git rev-parse HEAD > "$RUNNER_TEMP/tested/tested-commit"
          if [ "$KIND" = isolated ]; then
            [ -n "$TOOLCHAIN" ] || { echo "::error::the isolated runner left no toolchain stamp"; exit 1; }
            printf '%s\n' "$TOOLCHAIN" > "$RUNNER_TEMP/tested/toolchain"
            printf '%s\n' "$EXCUSED" > "$RUNNER_TEMP/tested/excused"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.route.outputs.build == 'true' && needs.mac.outputs.kind != 'working' && needs.route.outputs.harness-only == ''
        with:
          name: tested-tree-${{ needs.mac.outputs.kind == 'isolated' && 'isolated-' || '' }}${{ steps.tree.outputs.key }}
          path: ${{ runner.temp }}/tested
          if-no-files-found: error
          overwrite: true
          retention-days: 7
