# Build and run upstream's harnesses on every PR to main, the same way Sync tests main. Nothing is pushed.
name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/notchcast/actions/xcode
      - name: Catalog key order and references
        if: github.event_name == 'pull_request'
        working-directory: src
        run: |
          python3 notchcast/test-xcstrings.py
          python3 notchcast/check-xcstrings-order.py --base-ref "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
      - uses: ./tools/notchcast/actions/xcodegen
      - name: Regenerate project from project.yml
        working-directory: src
        run: |
          "$XCODEGEN" generate --quiet
      - name: Upstream base
        id: base
        working-directory: src
        run: |
          git fetch -q https://github.com/abue-ammar/tinycast.git "+refs/heads/main:refs/remotes/upstream/main"
          echo "sha=$(git merge-base HEAD refs/remotes/upstream/main)" >> "$GITHUB_OUTPUT"
      - name: Feature append shape and union merge proof
        working-directory: src
        run: |
          python3 notchcast/check-feature-shape.py
          python3 notchcast/check-feature-shape-test.py
      - name: Legacy command identities
        working-directory: src
        run: |
          python3 notchcast/check-legacy-command-ids.py
          python3 notchcast/check-legacy-command-ids-test.py
      - name: Build (Debug, unsigned)
        working-directory: src
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Lint
        working-directory: src
        run: |
          command -v swiftlint >/dev/null || brew install --quiet swiftlint
          ./Scripts/lint.sh
      - uses: ./tools/notchcast/actions/tests
        with:
          upstream: ${{ steps.base.outputs.sha }}
