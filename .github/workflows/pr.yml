# Build and run upstream's harnesses on every PR to main, the same way Sync tests main. Nothing is pushed.
name: PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Shared PR build lane
        working-directory: src
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash ../tools/notchcast/ci-build.sh
